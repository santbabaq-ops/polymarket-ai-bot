[project]
name = "polymarket-ai-bot"
version = "0.1.0"
description = "AI-powered gasless trading bot for Polymarket 5min/15min markets"
authors = [{name = "Author"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["polymarket", "trading-bot", "gasless", "ai", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web3 / Blockchain
    "web3>=6.0.0",
    "py_clob_client>=0.30.0",
    "py_order_utils>=0.3.0",
    "eth_abi>=4.0.0",

    # AI / ML
    "anthropic>=0.25.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",

    # Backtesting
    "vectorbt>=0.25.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # CLI / Config
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",

    # HTTP / Async
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
polybot = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true